<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reading list</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Reading list</h1>
      <form id="add-book">
        <label>Title <input name="title" required /></label>
        <label>Author <input name="author" required /></label>
        <button type="submit" disabled>Add book</button>
        <p id="add-book-error" class="form-error" role="alert" hidden></p>
      </form>
      <p id="read-count" class="read-count" hidden></p>
      <ul id="books"></ul>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
